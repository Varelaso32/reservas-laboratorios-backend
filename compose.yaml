name: reservas

services:
  api:
    build: .
    # --reload-dir app: vigila solo el código, no el .venv ni el resto del repo
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    ports:
      - "8000:8000"
    environment:
      WATCHFILES_FORCE_POLLING: "true"   # necesario en Windows para que --reload vea los cambios
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Lista para cuando se integre SQLAlchemy; por ahora la API no la usa
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas_dev
      POSTGRES_DB: reservas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas -d reservas"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
