# Alembic — migraciones versionadas de la base de datos.
#
# Uso (desde el contenedor api, que tiene el código montado):
#   docker compose exec api alembic upgrade head
#   docker compose exec api alembic revision --autogenerate -m "descripcion"
#
# La URL de conexión NO se define aquí: la resuelve migrations/env.py desde
# app.core.config (POSTGRES_* o DATABASE_URL), igual que la aplicación.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
