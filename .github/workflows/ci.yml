# ==============================================================================
# Nombre del Flujo: CI Backend
# Descripcion: Pipeline de Integracion Continua para la API de reservas 
# de laboratorios. Valida estandares de codigo y pruebas.
# ==============================================================================
name: ci Backend

on:
  push:
    branches: [ main, develop, qa ]
  pull_request:
    branches: [ main, develop, qa ]

jobs:
  # ============================================================================
  # 1. LINT: Analiza el código Python buscando errores de sintaxis y estilo.
  # ============================================================================
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Se configura Python 3.13 según la versión instalada en la documentación
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependencias base y Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar Linter (Flake8)
        # Detiene el flujo si hay errores críticos de sintaxis o variables no definidas
        run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics    