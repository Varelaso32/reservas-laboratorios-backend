# ==============================================================================
# Nombre del Flujo: CI Backend
# Descripcion: Pipeline de Integracion Continua para la API de reservas
# de laboratorios. Valida estandares de codigo y pruebas.
# ==============================================================================
name: ci Backend

on:
  # push solo a develop: los pull_request ya cubren las ramas del proyecto,
  # asi se evita la doble ejecucion (push + pull_request) sobre lo mismo.
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop, qa ]

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. LINT: Analiza el codigo Python con Ruff (unico estandar del repo).
  # ============================================================================
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar Ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.8"

      - name: Ejecutar Linter (Ruff)
        # La config de reglas vive en pyproject.toml ([tool.ruff])
        run: ruff check app

  # ============================================================================
  # 2. TEST: Ejecuta las pruebas de los endpoints y logica de negocio.
  # ============================================================================
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # BD Postgres para los tests: el conftest de pytest crea ahi la BD
    # 'reservas_test'. El job corre en el runner (sin contenedor), por eso
    # el servicio se alcanza via localhost y no via el hostname 'db' del compose.
    # La clave es de una BD desechable que solo existe durante el job; no es la
    # de ningun entorno real.
    env:
      TEST_DATABASE_URL: postgresql+psycopg://reservas:ci_solo_pruebas@localhost:5432/reservas_test

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: reservas
          POSTGRES_PASSWORD: ci_solo_pruebas
          POSTGRES_DB: reservas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservas -d reservas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        # --cov genera coverage.xml que SonarQube usa para medir la cobertura
        # (el Quality Gate exige >=80% en codigo nuevo)
        run: pytest tests/ --maxfail=1 --disable-warnings -q --cov=app --cov-report=xml:coverage.xml

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # ============================================================================
  # 3. SONAR: Analiza el codigo en SonarQube Cloud y espera el Quality Gate.
  # Si el gate no pasa, este job falla y deja el PR en rojo.
  # ============================================================================
  sonar:
    name: sonar
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true
