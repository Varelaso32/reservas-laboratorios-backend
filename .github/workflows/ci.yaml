# ==============================================================================
# Nombre del Flujo: CI Backend
# Descripcion: Pipeline de Integracion Continua para la API de reservas 
# de laboratorios. Valida estandares de codigo y pruebas.
# ==============================================================================
name: ci Backend

on:
  push:
    branches: [ main, develop, qa ]
  pull_request:
    branches: [ main, develop, qa ]

jobs:
  # ============================================================================
  # 1. LINT: Analiza el código Python buscando errores de sintaxis y estilo.
  # ============================================================================
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Se configura Python 3.13 según la versión instalada en la documentación
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependencias base y Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar Linter (Flake8)
        # Detiene el flujo si hay errores críticos de sintaxis o variables no definidas
        run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics    

# ============================================================================
  # 2. TEST: Ejecuta las pruebas de los endpoints y lógica de negocio.
  # ============================================================================
  test:
    name: test
    runs-on: ubuntu-latest

    # BD Postgres para los tests: el conftest de pytest crea ahi la BD
    # 'reservas_test'. El job corre en el runner (sin contenedor), por eso
    # el servicio se alcanza via localhost y no via el hostname 'db' del compose.
    env:
      TEST_DATABASE_URL: postgresql+psycopg://reservas:reservas_dev@localhost:5432/reservas_test

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: reservas
          POSTGRES_PASSWORD: reservas_dev
          POSTGRES_DB: reservas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservas -d reservas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependencias de la app y Pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

          pytest tests/ --maxfail=1 --disable-warnings -q