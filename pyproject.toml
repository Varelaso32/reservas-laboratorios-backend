[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "S", "ANN"]
ignore = [
    "E501",    # lineas largas (permiso del estandar v1.9)
    "ANN401",  # argumentos Any (permiso del estandar v1.9)
    "B008",    # Depends()/Query() en defaults: idiom normal de FastAPI
    "UP042",   # migrar a StrEnum exige refactor de los enums existentes (deuda)
    # Deuda de anotaciones de tipos: funciones sin anotar en develop, pendiente
    # de cerrar en una pasada de calidad dedicada.
    "ANN001",
    "ANN002",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN206",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
